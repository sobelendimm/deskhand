pre-commit:
  commands:
    kontrol:
      run: tools/kontrol.sh {staged_files}
    iz:
      # personal-trace scan; private words live outside the repo. Fail closed (--ek-zorunlu: a missing/empty private
      # file blocks the commit) only in clones that opt in with `git config deskhand.izZorunlu true`; elsewhere
      # (outside contributors, CI) a missing file is just a warning.
      run: python3 tools/iz_tara.py $([ "$(git config --bool --get deskhand.izZorunlu)" = true ] && echo --ek-zorunlu) --ek "$HOME/.config/deskhand/iz-desenleri.txt" {staged_files}

commit-msg:
  commands:
    iz-ileti:
      run: python3 tools/iz_tara.py $([ "$(git config --bool --get deskhand.izZorunlu)" = true ] && echo --ek-zorunlu) --ek "$HOME/.config/deskhand/iz-desenleri.txt" --ileti "$(cat {1})"
