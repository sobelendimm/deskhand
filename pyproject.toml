[build-system]
requires = ["setuptools>=77"]  # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "deskhand"
dynamic = ["version"]
description = "MCP server that lets Claude Code and other AI agents use your KDE Plasma (Wayland) desktop safely, on your screen or on an invisible second desktop"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "sobelendimm" }]
requires-python = ">=3.11"
keywords = ["MCP server", "Claude Code", "KDE Plasma", "Wayland", "mcp", "claude", "ai-agent", "computer-use", "kde", "plasma", "xvfb", "ocr", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# System tools are NOT Python packages and must come from the distribution
# (see README "Requirements"): kdotool, dotool, spectacle, tesseract (+ tur/eng data),
# Xvfb, openbox, xdotool; optional: pactl, systemd-run, a C compiler + wayland-client.
dependencies = [
    "PyQt6",
    "python-xlib",
    "numpy",
    "scipy",
    "pillow",
    "jeepney",
    "secretstorage",
    "cryptography",
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://github.com/sobelendimm/deskhand"
Issues = "https://github.com/sobelendimm/deskhand/issues"

[project.scripts]
deskhand = "deskhand.cli:main"

[tool.setuptools.dynamic]
version = { attr = "deskhand.__version__" }

[tool.setuptools.packages.find]
include = ["deskhand", "deskhand.*"]

[tool.setuptools.package-data]
# the C helpers ship as source (pip does not compile them): install.sh builds them in a git clone; after pip/pipx,
# `deskhand doctor` prints the `make -C <site-packages>/deskhand/yardimci` command (tests/test_paket.py checks the files)
deskhand = ["yardimci/*.c", "yardimci/*.h", "yardimci/Makefile", "data/*", "i18n/*.json", "gui/tema/*.json"]

[tool.ruff]
line-length = 140
target-version = "py311"
# other agents' worktrees and the Serena cache are not part of this tree
extend-exclude = [".claude/worktrees", ".serena"]

[tool.ruff.lint]
# ruff defaults (E4, E7, E9, F) + B (bug patterns) + SIM (simplification); same set as the
# maintainer's automation repository. Existing findings live in ruff-taban.txt (tools/kontrol.sh).
select = ["E4", "E7", "E9", "F", "B", "SIM"]
ignore = [
  "SIM105",  # try/except/pass -> contextlib.suppress: readability preference
  "SIM108",  # forced ternary
  "SIM115",  # open() without a context manager in short-lived scripts
  "E701",    # one-line if/for: house style
  "E702",
  "B904",
]

[[tool.ty.overrides]]
# Tests monkeypatch module functions with simplified fakes (sahte_*); their signatures differ on purpose.
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"
