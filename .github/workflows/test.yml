name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Same gate as the local pre-commit hook (lefthook.yml): shellcheck + ruff against ruff-taban.txt + gitleaks.
  # Tool versions are pinned to the ones the baseline was generated with; a newer ruff can add findings.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUFF_VERSION: "0.17.6"
      SHELLCHECK_VERSION: "0.11.0"
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff, shellcheck, gitleaks
        run: |
          pipx install "ruff==${RUFF_VERSION}"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          install -m 755 "$RUNNER_TEMP/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Quality gate (ruff baseline, shellcheck, gitleaks)
        run: |
          ruff --version; shellcheck --version | head -2; gitleaks version
          tools/kontrol.sh

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # python3-gi / gir1.2-atspi-2.0 are packages of the SYSTEM Python (/usr/bin/python3, 3.12 on 24.04):
      # actions/setup-python would install a different interpreter where `import gi` fails. All steps
      # therefore use the system Python through a venv that sees the system site-packages.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-gi gir1.2-atspi-2.0 \
            tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng \
            xvfb openbox xdotool x11-utils \
            gcc make pkg-config libsystemd-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            at-spi2-core bubblewrap dbus dbus-x11 \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libgl1 fonts-dejavu-core

      # libei (deskhand-eis, the KWin background desktop's input helper) is optional: the Makefile skips
      # that target when it is missing or older than LIBEI_EN_AZ (ei_ping; Ubuntu 24.04 ships an older libei),
      # and the KWin suites print "ATLANDI" without KWin >= 6.8.
      - name: Optional libei headers
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends libei-dev

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bubblewrap (bwrap) needs them.
      - name: Allow unprivileged user namespaces (bwrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Python environment (system Python + system site-packages)
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .
          .venv/bin/python -c "import gi; gi.require_version('Atspi', '2.0'); from gi.repository import Atspi; print('gi ok')"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build native helpers
        run: make -C deskhand/yardimci deskhand-etkinlik deskhand-goruntu deskhand-eis

      - name: Test suites (one by one)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Virtual X display + window manager; session D-Bus for the tests that need one (CI runner only).
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          openbox >/tmp/openbox.log 2>&1 &
          sleep 1
          # KWin suites (test_kwin_oturum, test_arka_kwin) exit 0 with "ATLANDI" when KWin >= 6.8 is absent
          # (Ubuntu 24.04 ships Plasma 5); the other suites use the Xvfb background desktop there.
          # test_ocr_gpu skips its GPU case without the OCR venv/GPU. tests/ekranli/ is never run (real screen).
          dbus-run-session -- tests/ci_kos.sh

      - name: i18n source audit
        run: python3 tools/i18n_cikar.py --denetle

      # No coverage threshold: missing English translations are not an error for now, only format errors.
      - name: i18n catalogue audit
        run: python3 tools/i18n_denetle.py
